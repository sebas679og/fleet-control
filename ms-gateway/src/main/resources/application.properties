spring.application.name=ms-gateway
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=${FLEET_CONTROL_LEVEL_LOGIN:WARN}
logging.level.root=${FLEET_CONTROL_LEVEL_LOGIN:INFO}
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1

# Gateway routes — FleetControl (8 services)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=vehicles-service
spring.cloud.gateway.server.webflux.routes[1].uri=${VEHICLES_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/vehicles/**
spring.cloud.gateway.server.webflux.routes[2].id=drivers-service
spring.cloud.gateway.server.webflux.routes[2].uri=${DRIVERS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/drivers/**
spring.cloud.gateway.server.webflux.routes[3].id=routes-service
spring.cloud.gateway.server.webflux.routes[3].uri=${ROUTES_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/routes/**
spring.cloud.gateway.server.webflux.routes[4].id=maintenance-service
spring.cloud.gateway.server.webflux.routes[4].uri=${MAINTENANCE_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/maintenance/**
spring.cloud.gateway.server.webflux.routes[5].id=fuel-service
spring.cloud.gateway.server.webflux.routes[5].uri=${FUEL_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/fuel/**
spring.cloud.gateway.server.webflux.routes[6].id=alerts-service
spring.cloud.gateway.server.webflux.routes[6].uri=${ALERTS_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/alerts/**
spring.cloud.gateway.server.webflux.routes[7].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[7].uri=${DASHBOARD_SERVICE_URL:http://localhost:8089}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/dashboard/**

# Default filters — strip internal key (AuthenticationFilter added as custom code later)
spring.cloud.gateway.server.webflux.default-filters[0]=RemoveRequestHeader=X-Internal-Key

# Rate limiting (Caffeine, in-memory)
gateway.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:60}

# Timeouts — proxy 5s -> 503, downstream /health 2s
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
gateway.timeout.health=2s
