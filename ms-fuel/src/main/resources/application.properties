spring.application.name=ms-fuel
server.port=8087
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=${FLEET_CONTROL_LEVEL_LOGIN:WARN}
logging.level.root=${FLEET_CONTROL_LEVEL_LOGIN:INFO}
management.endpoints.web.exposure.include=health

# Datasource
spring.datasource.url=${FLEET_CONTROL_DATASOURCE_URL_FUEL:jdbc:postgresql://localhost:5432/fuel_db}
spring.datasource.username=${FLEET_CONTROL_DATASOURCE_USERNAME:fleet_app}
spring.datasource.password=${FLEET_CONTROL_DATASOURCE_PASSWORD:Fleet_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${FLEET_CONTROL_JPA_DDL:validate}
spring.jpa.show-sql=${FLEET_CONTROL_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# JWT
jwt.secret=${JWT_SECRET:change_this_secret_of_at_least_32_chars_123456}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Internal key
internal.api-key=${INTERNAL_API_KEY:change_this_internal_key}

# Downstream
vehicles.service.url=${VEHICLES_SERVICE_URL:http://localhost:8082}

# Feign timeouts
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Resilience4j
resilience4j.circuitbreaker.instances.vehicles.sliding-window-size=10
resilience4j.circuitbreaker.instances.vehicles.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vehicles.wait-duration-in-open-state=30s

# Demo seeder
demo.seed=${DEMO_SEED:42}
demo.days=${DEMO_DAYS:90}

# OpenAPI
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1