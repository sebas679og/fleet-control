spring.application.name=ms-vehicles
server.port=8082
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=${FLEET_CONTROL_LEVEL_LOGIN:WARN}
logging.level.root=${FLEET_CONTROL_LEVEL_LOGIN:INFO}
management.endpoints.web.exposure.include=health

# Datasource Configuration (defaults work without .env for local runs)
spring.datasource.url=${FLEET_CONTROL_DATASOURCE_URL_VEHICLES:jdbc:postgresql://localhost:5432/vehicles_db}
spring.datasource.username=${FLEET_CONTROL_DATASOURCE_USERNAME:fleet_app}
spring.datasource.password=${FLEET_CONTROL_DATASOURCE_PASSWORD:Fleet_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${FLEET_CONTROL_JPA_DDL:validate}
spring.jpa.show-sql=${FLEET_CONTROL_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# JWT Configuration (US-03: validate HS256 locally)
jwt.secret=${JWT_SECRET:change_this_secret_of_at_least_32_chars_123456}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Internal service-to-service key (US-03)
internal.api-key=${INTERNAL_API_KEY:change_this_internal_key}

# Demo seeder (US-16)
demo.seed=${DEMO_SEED:42}
demo.days=${DEMO_DAYS:90}

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1