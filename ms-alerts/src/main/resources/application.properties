spring.application.name=ms-alerts
server.port=8088
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=${FLEET_CONTROL_LEVEL_LOGIN:WARN}
logging.level.root=${FLEET_CONTROL_LEVEL_LOGIN:INFO}
management.endpoints.web.exposure.include=health


# Datasource Configuration
spring.datasource.url=${FLEET_CONTROL_DATASOURCE_URL_ALERTS}
spring.datasource.username=${FLEET_CONTROL_DATASOURCE_USERNAME}
spring.datasource.password=${FLEET_CONTROL_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPORTS_PULSE_JPA_DDL:validate}
spring.jpa.show-sql=${SPORTS_PULSE_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1

